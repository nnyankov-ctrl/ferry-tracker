<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Паром Valentia ↔ Cahersiveen</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --sea:#0f3d52; --sea-deep:#0a2c3c; --foam:#e8f1f2;
    --hull:#e4572e; --ink:#0a2c3c; --muted:#5b7a86; --line:#c9dbe0;
    --live:#1d9e75; --stale:#9aa6ab;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:var(--foam);
  }
  #map{position:absolute;inset:0;z-index:1;background:var(--sea)}

  /* Панель статуса поверх карты */
  .panel{
    position:absolute;z-index:2;left:12px;right:12px;top:12px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
    border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;max-width:420px;margin:0 auto;
    box-shadow:0 6px 24px rgba(10,44,60,.12);
  }
  .row{display:flex;align-items:baseline;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--stale);flex:none;
       align-self:center;transition:background .3s}
  .dot.live{background:var(--live);box-shadow:0 0 0 4px rgba(29,158,117,.18)}
  .status{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .grid{display:flex;gap:20px;margin-top:12px;padding-top:12px;
        border-top:1px solid var(--line)}
  .cell .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .cell .v{font-size:20px;font-weight:600;margin-top:2px}
  .cell .v small{font-size:12px;font-weight:400;color:var(--muted)}

  /* Значок парома — стрелка, поворачивается по курсу */
  .boat{transform-origin:center}
  .boat svg{display:block;filter:drop-shadow(0 2px 3px rgba(10,44,60,.4))}

  .legend{position:absolute;z-index:2;left:12px;bottom:12px;
    background:rgba(255,255,255,.92);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
  .attr{position:absolute;z-index:2;right:8px;bottom:8px;font-size:10px;color:#9db0b7}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Карта с положением парома"></div>

<div class="panel" id="panel">
  <div class="row">
    <span class="dot" id="dot"></span>
    <div>
      <div class="status" id="status">Подключаюсь…</div>
      <div class="sub" id="sub">Жду данные с парома</div>
    </div>
  </div>
  <div class="grid" id="grid" style="display:none">
    <div class="cell"><div class="k">Скорость</div><div class="v" id="speed">—</div></div>
    <div class="cell"><div class="k">Прибытие</div><div class="v" id="eta">—</div></div>
    <div class="cell"><div class="k">Обновлено</div><div class="v" id="ago">—</div></div>
  </div>
</div>

<div class="legend">● паром &nbsp;·&nbsp; ⚓ причалы</div>
<div class="attr">© OpenStreetMap</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.7.0/dist/mqtt.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const C = window.FERRY_CONFIG;

  // --- Карта ---
  const mid = {
    lat:(C.piers.island.lat + C.piers.mainland.lat)/2,
    lon:(C.piers.island.lon + C.piers.mainland.lon)/2
  };
  const map = L.map('map',{zoomControl:true}).setView([mid.lat, mid.lon], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19}).addTo(map);

  // Причалы
  const anchorIcon = L.divIcon({html:'⚓',className:'',iconSize:[20,20],iconAnchor:[10,10]});
  L.marker([C.piers.island.lat, C.piers.island.lon],{icon:anchorIcon})
    .addTo(map).bindTooltip(C.piers.island.name);
  L.marker([C.piers.mainland.lat, C.piers.mainland.lon],{icon:anchorIcon})
    .addTo(map).bindTooltip(C.piers.mainland.name);

  // Значок парома (стрелка)
  function boatIcon(heading, live){
    const col = live ? getCSS('--hull') : getCSS('--stale');
    return L.divIcon({
      className:'',
      iconSize:[34,34], iconAnchor:[17,17],
      html:`<div class="boat" style="transform:rotate(${heading}deg)">
              <svg width="34" height="34" viewBox="0 0 34 34">
                <path d="M17 3 L27 29 L17 23 L7 29 Z" fill="${col}"/>
              </svg></div>`
    });
  }
  let boatMarker = null;

  // --- Утилиты ---
  function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
  const R = 6371000;
  function distM(a,b,c,d){ // расстояние по земле, метры
    const t=Math.PI/180, dφ=(c-a)*t, dλ=(d-b)*t;
    const x=Math.sin(dφ/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(dλ/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }
  let prev = null; // прошлая точка для расчёта курса, если модем его не даёт

  // --- Отрисовка позиции ---
  function render(m){
    const island   = C.piers.island, mainland = C.piers.mainland;
    const dIsland   = distM(m.lat,m.lon, island.lat,  island.lon);
    const dMainland = distM(m.lat,m.lon, mainland.lat,mainland.lon);

    // Курс: берём из данных, иначе считаем по смещению
    let hdg = (m.hdg && m.hdg>0) ? m.hdg : (prev ? bearing(prev,m) : 0);

    // Направление: цель — более дальний причал (тот, к которому паром плывёт).
    const goingTo = dIsland > dMainland ? island : mainland;

    const moving = m.spd >= 2;
    let statusText, subText;
    if(!moving){
      const near = dIsland < dMainland ? island : mainland;
      statusText = 'Стоит у причала';
      subText = near.name;
    } else {
      statusText = '→ идёт к ' + goingTo.name;
      subText = 'В пути';
    }
    document.getElementById('status').textContent = statusText;
    document.getElementById('sub').textContent = subText;

    // ETA = расстояние до цели / скорость
    const dTarget = distM(m.lat,m.lon, goingTo.lat, goingTo.lon);
    let etaText = '—';
    if(moving && m.spd>0){
      const mins = (dTarget/1000) / m.spd * 60;
      etaText = mins < 1 ? '<1 мин' : Math.round(mins)+' мин';
    }
    document.getElementById('eta').textContent = etaText;
    document.getElementById('speed').innerHTML =
      m.spd.toFixed(0)+' <small>км/ч</small>';

    // Маркер
    const live = true;
    if(!boatMarker){
      boatMarker = L.marker([m.lat,m.lon],{icon:boatIcon(hdg,live)}).addTo(map);
    } else {
      boatMarker.setLatLng([m.lat,m.lon]);
      boatMarker.setIcon(boatIcon(hdg,live));
    }
    document.getElementById('grid').style.display='flex';
    prev = m;
    lastUpdate = Date.now();
  }

  function bearing(a,b){
    const t=Math.PI/180;
    const y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t);
    const x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-
            Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }

  // --- «Обновлено N назад» + признак устаревания ---
  let lastUpdate = 0;
  setInterval(()=>{
    if(!lastUpdate) return;
    const s = Math.floor((Date.now()-lastUpdate)/1000);
    document.getElementById('ago').innerHTML =
      s<60 ? s+' <small>сек</small>' : Math.floor(s/60)+' <small>мин</small>';
    const stale = s > C.staleAfterSeconds;
    document.getElementById('dot').classList.toggle('live', !stale);
    if(stale){
      document.getElementById('status').textContent='Нет свежих данных';
      document.getElementById('sub').textContent='Паром, возможно, не в рейсе';
      if(boatMarker) boatMarker.setIcon(boatIcon(prev?prev.hdg||0:0,false));
    }
  },1000);

  // --- MQTT ---
  const b = C.broker;
  const url = `wss://${b.host}:${b.port}${b.path}`;
  const client = mqtt.connect(url,{
    username:b.username, password:b.password,
    clientId:'web-'+Math.random().toString(16).slice(2,8),
    clean:true, reconnectPeriod:3000,
  });

  client.on('connect', ()=>{
    document.getElementById('status').textContent='Жду паром…';
    document.getElementById('dot').classList.add('live');
    client.subscribe(b.topic);
  });
  client.on('message', (topic,buf)=>{
    try{
      const m = JSON.parse(buf.toString());
      if(typeof m.lat==='number' && typeof m.lon==='number') render(m);
    }catch(e){ console.warn('битое сообщение', e); }
  });
  client.on('error', e=>{
    document.getElementById('status').textContent='Ошибка подключения';
    document.getElementById('sub').textContent='Проверь настройки брокера в config.js';
    console.error(e);
  });
})();
</script>
</body>
</html>
